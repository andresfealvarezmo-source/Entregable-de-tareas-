<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión académica</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Arial, sans-serif; background: #f1f5f9; }
      .contenedor { max-width: 700px; margin: 40px auto; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 4px 15px #00000015; }
      h1 { color: #2563eb; text-align: center; margin-top: 0; }
      p { text-align: center; color: #64748b; }
      .formulario { display: flex; flex-wrap: wrap; gap: 10px; }
      input { flex: 1 1 180px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; }
      button { padding: 10px 15px; border: none; border-radius: 6px; background: #2563eb; color: white; cursor: pointer; font-size: 16px; }
      button.eliminar { background: #dc2626; }
      ul { padding: 0; list-style: none; }
      li { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 10px 0; padding: 10px; background: #f8fafc; border-radius: 6px; }
      .datos { display: flex; flex-direction: column; }
      .datos small { color: #64748b; }
      @media (max-width: 600px) {
        .contenedor { margin: 0; padding: 20px; border-radius: 0; min-height: 100vh; }
        .formulario button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/App.jsx"></script>
  </body>
</html>
